[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "molmanager"
version = "0.1.0"
description = "Desktop chemistry table manager (PyQt5 + RDKit)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hunter Picard" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15",
    "plotly>=5.0,<6",
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "scipy>=1.10",
    "sqlalchemy>=2.0",
    "pubchempy>=1.0.4",
    "chembl_webresource_client>=0.10.9",
    "rdkit>=2022.9.5",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.5",
]

[project.optional-dependencies]
# ML extras expect a matching PyTorch stack (see requirements.txt / install_pytorch_pka.*).
pka = [
    "pkasolver @ git+https://github.com/mayrf/pkasolver.git",
    "torch-geometric==2.0.1",
    "svgutils",
]
permeability = [
    "chemprop>=2.1.0,<2.3",
    "lightning>=2.0,<3",
]
docking = [
    "meeko>=0.5.0",
    "pdbfixer>=1.9",
    "openmm>=8.2,<8.3",
]
dev = [
    "pytest>=7.4,<9",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
molmanager = "molmanager.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["molmanager*"]

[tool.setuptools.package-data]
molmanager = [
    "ui/static/*",
    "resources/README.md",
    "resources/help/**/*.md",
    "resources/models/**/README.md",
    "resources/models/**/.gitkeep",
    "resources/bin/**/.gitkeep",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["molmanager", "tests", "scripts"]
extend-exclude = [
    "molmanager/ui/static",
]

[tool.ruff.lint]
# Correctness plus unused import/variable hygiene.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "F401",
    "F841",
]
